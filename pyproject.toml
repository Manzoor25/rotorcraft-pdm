[project]
name = "rotorcraft-pdm"
version = "0.1.0"
description = "Public-data proof of concept for rotorcraft predictive maintenance."
requires-python = ">=3.11"
dependencies = [
  "pandas==2.2.3",
  "numpy",
  "scikit-learn",
  "lightgbm",
  "xgboost",
  "mlflow==2.22.1",
  "sqlalchemy==2.0.54",
  "optuna",
  "pandera",
  "fastapi",
  "uvicorn",
  "httpx",
  "streamlit",
  "plotly",
  "scipy",
  "pyyaml",
  "h5py",
  "tables",
  "joblib",
  "matplotlib",
  "python-dotenv",
  "torch",
]

[project.optional-dependencies]
dev = ["pytest", "ruff", "black", "mypy", "pre-commit", "nbformat"]
azure = ["azure-ai-ml", "azure-identity", "azure-storage-blob", "azureml-mlflow"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["venv", "data", "models", "reports"]

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# Scripts insert the src folder on the path before importing the package,
# so a laptop can run them before `pip install -e .`.
"scripts/*.py" = ["E402"]

[tool.black]
line-length = 100
extend-exclude = "venv"

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
packages = ["rotorcraft_pdm"]
mypy_path = "src"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
