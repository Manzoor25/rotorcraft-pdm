# Manual only. A push must not retrain or deploy.
# Required repository secrets, if you want the Azure steps to run:
#   AZURE_CLIENT_ID, AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID
name: retrain-and-maybe-promote

on:
  workflow_dispatch:
    inputs:
      production_nasa_score:
        description: "Current production NASA score. Lower is better."
        required: true
        default: "999999"

jobs:
  compare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Unit tests still pass
        run: pytest
      - name: Compare NASA scores
        id: gate
        run: |
          python scripts/download_data.py
          python scripts/train.py
          python scripts/promote.py reports/metrics.json "${{ inputs.production_nasa_score }}"
      - name: Azure login
        if: success()
        uses: azure/login@v2
        continue-on-error: true
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Note
        if: success()
        run: |
          echo "Candidate beat the production NASA score."
          echo "Register and deploy from a machine that can reach the private storage account."
          echo "See RUNBOOK.md. This workflow does not upload from GitHub-hosted runners,"
          echo "because this subscription disables public storage access."
